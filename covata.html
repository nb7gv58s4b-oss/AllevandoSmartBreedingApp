
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALLEVANDO - Scheda covata</title>
<link rel="stylesheet" href="./css/style.css">
<style>
body{margin:0;background:#f3f5f2;font-family:Arial,sans-serif;color:#26352c}
.page{max-width:850px;margin:auto;padding:20px}
.panel{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 10px #0000000d}
h1,h2{color:#285b3d}
input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd5ce;border-radius:8px;font-size:16px}
label{font-weight:600;font-size:14px}
button{background:#285b3d;color:white;border:0;border-radius:8px;padding:13px 20px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.muted{color:#68776d;font-size:14px}
.error{color:#b42318}
.success{color:#168044}
.item{padding:12px;border-bottom:1px solid #e5eae6}
.hidden{display:none}
@media(max-width:550px){.grid{grid-template-columns:1fr}.page{padding:12px}}
</style>
</head>
<body>
<div class="page">
<header class="panel">
<h1>ALLEVANDO Smart Breeding™</h1>
<p class="muted">Scheda digitale di riproduzione</p>
</header>

<section id="login" class="panel hidden">
<h2>Accedi al tuo allevamento</h2>
<p class="muted">Per consultare e modificare questa scheda devi accedere al tuo account.</p>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required autocomplete="username">
<label>Password</label>
<input id="password" type="password" required autocomplete="current-password">
<button type="submit">Accedi e apri la covata</button>
</form>
<p id="loginMessage" class="error"></p>
</section>

<section id="sheet" class="hidden">
<div class="panel">
<h2 id="sheetTitle">Scheda covata</h2>
<p id="pairInfo" class="muted"></p>
<p id="seasonInfo" class="muted"></p>
</div>

<form id="covataForm">
<div class="panel">
<h2>Dati della covata</h2>
<div class="grid">
<div><label>Gabbia</label><input id="gabbia"></div>
<div><label>Stato</label>
<select id="stato">
<option value="">Da definire</option>
<option value="In corso">In corso</option>
<option value="In cova">In cova</option>
<option value="Schiusa">Schiusa</option>
<option value="Conclusa">Conclusa</option>
</select></div>
<div><label>Data deposizione</label><input id="data_deposizione" type="date"></div>
<div><label>Inizio cova</label><input id="data_inizio_cova" type="date"></div>
<div><label>Speratura prevista</label><input id="data_speratura_prevista" type="date"></div>
<div><label>Speratura effettiva</label><input id="data_speratura_effettiva" type="date"></div>
<div><label>Uova deposte</label><input id="uova_deposte" type="number" min="0"></div>
<div><label>Uova feconde</label><input id="uova_feconde" type="number" min="0"></div>
<div><label>Schiusa prevista</label><input id="data_schiusa_prevista" type="date"></div>
<div><label>Schiusa effettiva</label><input id="data_schiusa_effettiva" type="date"></div>
</div>
<label>Note della covata</label>
<textarea id="note" rows="4"></textarea>
<button id="saveButton" type="submit">Salva modifiche</button>
<p id="saveMessage"></p>
</div>
</form>

<div class="panel">
<h2>Uova registrate</h2>
<div id="eggs" class="muted">Nessun uovo registrato.</div>
</div>

<div class="panel">
<h2>Pulli</h2>
<div id="chicks" class="muted">Nessun pullo registrato.</div>
</div>
</section>

<section id="loading" class="panel">
<p>Caricamento della scheda...</p>
</section>

<p id="globalMessage" class="error"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script src="./js/supabase.js"></script>

<script>
(async function(){
const client=window.supabaseClient;
const params=new URLSearchParams(location.search);
const tag=params.get("tag");
const $=id=>document.getElementById(id);

let codiceTag=tag;
let covata=null;

function message(id,text,cls=""){
$(id).textContent=text;
$(id).className=cls;
}

function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}

function dateValue(v){return v||""}
function numberValue(v){return v===null||v===undefined?"":v}

function renderList(id,items,type){
const area=$(id);
area.replaceChildren();
if(!items||!items.length){
area.textContent=type==="egg"?"Nessun uovo registrato.":"Nessun pullo registrato.";
return;
}
items.forEach(item=>{
const div=document.createElement("div");
div.className="item";
if(type==="egg"){
div.textContent="Uovo "+item.numero+" — "+(item.data_deposizione||"Data non indicata")+" — "+(item.esito_speratura||"Esito non indicato");
}else{
div.textContent=(item.anello||"Pullo senza anello")+" — "+(item.sesso||"Sesso non indicato")+" — "+(item.mutazione||"Mutazione non indicata")+" — "+(item.stato||"");
}
area.appendChild(div);
});
}

async function loadSheet(){
hide("loading");
show("sheet");

const {data,error}=await client.rpc("apri_covata_da_tag",{p_codice:codiceTag});
if(error||!data||!data.covata){
hide("sheet");
message("globalMessage",error?error.message:"Scheda non trovata o accesso non autorizzato.","error");
return;
}

covata=data.covata;
const c=covata;

$("sheetTitle").textContent="Covata n. "+c.numero;
$("pairInfo").textContent="Coppia: "+(data.coppia?.codice||"");
$("seasonInfo").textContent="Stagione: "+(data.stagione?.anno||"");

[
"gabbia","data_deposizione","data_inizio_cova",
"data_speratura_prevista","data_speratura_effettiva",
"uova_deposte","uova_feconde","data_schiusa_prevista",
"data_schiusa_effettiva","note","stato"
].forEach(key=>{
$(key).value=key.startsWith("data_")?dateValue(c[key]):key.startsWith("uova_")?numberValue(c[key]):(c[key]??"");
});

renderList("eggs",data.uova,"egg");
renderList("chicks",data.pulli,"chick");
}

async function checkSession(){
const {data,error}=await client.auth.getSession();
hide("loading");
if(error){
message("globalMessage",error.message,"error");
return;
}
if(!data.session){
show("login");
return;
}
await loadSheet();
}

if(!client){
message("globalMessage","Connessione Supabase non inizializzata.","error");
hide("loading");
return;
}
if(!codiceTag){
message("globalMessage","Codice NFC mancante nel collegamento.","error");
hide("loading");
return;
}

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
message("loginMessage","Accesso in corso...");
const {error}=await client.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});
if(error){
message("loginMessage",error.message,"error");
return;
}
hide("login");
await loadSheet();
});

$("covataForm").addEventListener("submit",async e=>{
e.preventDefault();
if(!covata)return;
const button=$("saveButton");
button.disabled=true;
message("saveMessage","Salvataggio in corso...");

const n=id=>$(id).value===""?null:Number($(id).value);
const d=id=>$(id).value||null;

const {data,error}=await client.rpc("salva_covata_da_tag",{
p_codice:codiceTag,
p_gabbia:$("gabbia").value||null,
p_data_deposizione:d("data_deposizione"),
p_data_inizio_cova:d("data_inizio_cova"),
p_data_speratura_prevista:d("data_speratura_prevista"),
p_data_speratura_effettiva:d("data_speratura_effettiva"),
p_uova_deposte:n("uova_deposte"),
p_uova_feconde:n("uova_feconde"),
p_data_schiusa_prevista:d("data_schiusa_prevista"),
p_data_schiusa_effettiva:d("data_schiusa_effettiva"),
p_note:$("note").value||null,
p_stato:$("stato").value||null
});

button.disabled=false;
if(error){
message("saveMessage","Errore: "+error.message,"error");
return;
}
message("saveMessage","Modifiche salvate correttamente.","success");
});

await checkSession();
})();
</script>
</body>
</html>
