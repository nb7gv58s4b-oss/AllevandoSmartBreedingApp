
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174b38">
    <title>ALLEVANDO Smart Breeding™</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>ALLEVANDO Smart Breeding™</h1>
        <p>Il gestionale intelligente per l'allevamento ornitologico</p>
    </header>

    <main>
        <section class="welcome">
            <h2>La tua gestione, in un unico spazio</h2>
            <p>Accedi per gestire coppie, stagioni riproduttive e schede delle covate.</p>

            <div id="login-area">
                <h3>Accedi al tuo account</h3>

                <form id="login-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="La tua email">

                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="La tua password">

                    <button type="submit">Accedi</button>
                </form>

                <p id="auth-message" role="status"></p>
            </div>

            <div id="app-area" hidden>
                <h2>Benvenuto nel tuo allevamento!</h2>
                <p id="user-email"></p>
                <button id="logout-button" type="button">Esci</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
